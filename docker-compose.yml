services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_DASHBOARD_TOUR_VERSION: ${NEXT_PUBLIC_DASHBOARD_TOUR_VERSION:-1}
        NEXT_PUBLIC_DEBUG_MODE: ${NEXT_PUBLIC_DEBUG_MODE:-false}
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    container_name: arogyamandiram-app
    restart: unless-stopped
    ports:
      - "${APP_HOST_PORT:-3000}:3000"
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      # Database — points to the compose MongoDB service
      MONGODB_URI: mongodb://mongo:27017/arogyamandiram
      MONGO_DB: arogyamandiram

      # Keep container port stable for Docker publishing (host APP_HOST_PORT -> container 3000)
      PORT: 3000

      # NextAuth — required
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:${APP_HOST_PORT:-3000}}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}

      # Encryption — required for per-user API key storage
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      # OpenAI-compatible endpoint
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_ORG_ID: ${OPENAI_ORG_ID:-}
      OPENAI_MODEL_BEST: ${OPENAI_MODEL_BEST:-}
      OPENAI_MODEL_ORCHESTRATOR: ${OPENAI_MODEL_ORCHESTRATOR:-}

      # Food search
      FDC_API_KEY: ${FDC_API_KEY:-DEMO_KEY}
      FOOD_CACHE_TTL_DAYS: ${FOOD_CACHE_TTL_DAYS:-7}

      # Email
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      IMAP_HOST: ${IMAP_HOST:-imap.gmail.com}
      IMAP_PORT: ${IMAP_PORT:-993}

      # Cron
      CRON_SECRET: ${CRON_SECRET}

      # Feature flags
      NEXT_PUBLIC_DASHBOARD_TOUR_VERSION: ${NEXT_PUBLIC_DASHBOARD_TOUR_VERSION:-1}
      NEXT_PUBLIC_DEBUG_MODE: ${NEXT_PUBLIC_DEBUG_MODE:-false}

  mongo:
    image: mongo:7
    container_name: arogyamandiram-mongo
    restart: unless-stopped
    volumes:
      - arogyamandiram_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  arogyamandiram_mongo_data:

